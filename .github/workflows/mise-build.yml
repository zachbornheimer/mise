name: mise-build

# Assembles a custom `mise` from the fork's `main` (upstream plus one carry
# commit holding this workflow and `.mise-build/`) merged with every branch
# that has a file under `.mise-build/branches/`, builds a darwin-arm64 binary,
# and publishes it as a GitHub release marked latest. Same shape as the
# zachbornheimer/oh-my-pi `omp-build` workflow: see `.mise-build/README.md`.
#
# The base of every assembly is the commit that triggered the run
# ($GITHUB_SHA): main's tip for a push to main or the scheduled poll, the
# dispatched ref's tip for a manual run. A merge conflict with the base or an
# earlier branch, or a listed branch missing from the fork, fails the run with
# an `::error` naming the branch and leaves the previous release as latest.
# A branch already contained in jdx/mise:main only warns: delete its file.
#
# A workflow_dispatch with a non-empty branches_override publishes a
# PRERELEASE (mise ignores prereleases) and never latest.
on:
  push:
    branches: [main]
  schedule:
    # A push to a carried topic branch cannot trigger this workflow (the
    # branch does not hold it), so a change to any listed branch is picked up
    # by this poll. An unchanged tree skips build and publish. GitHub's
    # `schedule` is best-effort and may skip slots.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      branches_override:
        description: "Comma-separated branch list (non-empty publishes a prerelease mise ignores, never latest; empty uses the files under .mise-build/branches/)"
        type: string
        default: ""

concurrency:
  group: mise-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble mise-build
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      build-sha: ${{ steps.decide.outputs.build-sha }}
      base-sha: ${{ steps.decide.outputs.base-sha }}
      upstream-sha: ${{ steps.decide.outputs.upstream-sha }}
      override: ${{ steps.decide.outputs.override }}
      tag: ${{ steps.decide.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: assembly
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Resolve branch list
        id: branches
        env:
          BRANCHES_OVERRIDE: ${{ inputs.branches_override }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "list<<EOF"
            bun assembly/.mise-build/resolve-branches.ts "$BRANCHES_OVERRIDE" "$EVENT_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve base and upstream
        id: base
        working-directory: assembly
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          # A full-hex SHA only: the value becomes part of the release tag.
          echo "$base" | grep -qE '^[0-9a-f]{40}$' || {
            echo "::error title=Bad base::the triggering commit did not resolve to a commit SHA: $base"
            exit 1
          }
          git remote add upstream https://github.com/jdx/mise.git
          git fetch --quiet upstream main
          upstream="$(git merge-base "$base" upstream/main)"
          echo "$upstream" | grep -qE '^[0-9a-f]{40}$' || {
            echo "::error title=No upstream base::the triggering commit shares no history with jdx/mise:main"
            exit 1
          }
          echo "::notice title=main vs upstream::base $base contains upstream ${upstream:0:7} and is $(git rev-list --count "$base..upstream/main") commits behind upstream main"
          {
            echo "sha=$base"
            echo "upstream=$upstream"
          } >> "$GITHUB_OUTPUT"

      - name: Merge topic branches into mise-build
        id: merge
        env:
          BRANCHES: ${{ steps.branches.outputs.list }}
          FORK_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          cd assembly
          git config user.name "mise-build bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add fork "$FORK_URL"
          # Lease base: the mise-build tip this run replaces.
          lease=(--force)
          if git fetch fork refs/heads/mise-build:refs/remotes/fork/mise-build 2>/dev/null; then
            lease=(--force-with-lease="refs/heads/mise-build:$(git rev-parse refs/remotes/fork/mise-build)")
          fi
          printf '%s\n' "${lease[@]}" > "$RUNNER_TEMP/lease.txt"
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if ! git fetch fork "refs/heads/$branch"; then
              echo "::error title=Missing branch::$branch is not on ${{ github.repository }}: push it, or delete .mise-build/branches/$branch.toml on main"
              exit 1
            fi
            if git merge-base --is-ancestor "refs/remotes/fork/$branch" upstream/main; then
              echo "::warning title=Merged upstream::$branch is already contained in jdx/mise:main - delete .mise-build/branches/$branch.toml"
            fi
            if ! git merge --no-ff --no-edit "refs/remotes/fork/$branch"; then
              conflicts="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              echo "::error title=Conflict::$branch conflicts with the base or an earlier branch ($conflicts). Merge main into $branch, resolve, push; deleting its manifest file removes its work from the build and is not a fix"
              exit 1
            fi
          done <<< "$BRANCHES"

      - name: Decide skip and record shas
        id: decide
        env:
          OVERRIDE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.branches_override != '' }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          UPSTREAM_SHA: ${{ steps.base.outputs.upstream }}
        run: |
          set -euo pipefail
          cd assembly
          build_sha="$(git rev-parse HEAD)"
          base_sha="$BASE_SHA"
          upstream_sha="$UPSTREAM_SHA"
          # Computed here: the release job publishes under this tag. The UTC
          # timestamp is one numeric chunk so mise orders releases by time.
          tag="build-$(date -u +%Y%m%d%H%M%S)-${upstream_sha:0:7}-${build_sha:0:7}"
          # A normal run that assembles the base alone is branchless: fail
          # instead of publishing it as what mise installs.
          if [ "$OVERRIDE_RUN" != "true" ] && [ "$build_sha" = "$base_sha" ]; then
            echo "::error title=Branchless assembly::assembled SHA $build_sha equals the base - a normal run must merge the configured branches"
            exit 1
          fi
          skip=false
          # The release body records `build_commit:`; an identical tree means
          # the latest release already ships this assembly.
          recorded="$(gh release view --json body --jq .body 2>/dev/null | grep -oE 'build_commit: [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true)"
          if [ -n "$recorded" ] && git cat-file -e "$recorded^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse "$recorded^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ]; then
              skip=true
            fi
          fi
          {
            echo "skip=$skip"
            echo "build-sha=$build_sha"
            echo "base-sha=$base_sha"
            echo "upstream-sha=$upstream_sha"
            echo "override=$OVERRIDE_RUN"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Push mise-build to the fork
        if: steps.decide.outputs.skip != 'true'
        env:
          FORK_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          mapfile -t lease < "$RUNNER_TEMP/lease.txt"
          cd assembly && git push "${lease[@]}" "$FORK_URL" HEAD:refs/heads/mise-build

  release:
    name: Publish release
    needs: [assemble]
    if: ${{ !cancelled() && needs.assemble.result == 'success' && needs.assemble.outputs.skip != 'true' }}
    # One native runner per target: Rust cannot cross-compile the way Go does.
    # darwin-arm64 is this Mac; linux-x64 is the VPS and every E2B sandbox.
    permissions:
      contents: write
    uses: zysys/github-workflows/.github/workflows/rust-release.yml@45470a74081d8941e02a5e12f7436262c43949fd
    with:
      binary: mise
      # The assembly the assemble job pushed; the release points at its commit.
      ref: mise-build
      tag: ${{ needs.assemble.outputs.tag }}
      release_target: ${{ needs.assemble.outputs.build-sha }}
      prerelease: ${{ needs.assemble.outputs.override == 'true' }}
      targets: |
        [{"target":"darwin-arm64","os":"macos-latest"},
         {"target":"linux-x64","os":"ubuntu-22.04"}]
      build_env: |
        MACOSX_DEPLOYMENT_TARGET=12.0
      # `build_commit` is read back by the next run's skip check: the same tree
      # means the latest release already ships this assembly.
      notes: |
        Custom `mise` assembled from the fork's main (jdx/mise plus one carry commit) plus the branches in `.mise-build/branches/`.

        build_commit: ${{ needs.assemble.outputs.build-sha }}
        base_commit: ${{ needs.assemble.outputs.base-sha }}
        upstream_commit: ${{ needs.assemble.outputs.upstream-sha }}
