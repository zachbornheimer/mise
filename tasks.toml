#:schema ./schema/mise-task.json

[clean]
description = 'Clean build artifacts'
run = 'cargo clean'

[ci]
depends = ["format", "build", "test"]
description = "Run all CI checks"

[lint]
description = 'Run all lint checks'
depends = ['lint:*']

# The Clippy passes CI runs (.github/workflows/test-impl.yml). Kept out of
# hk.pkl so the git pre-commit hook, which runs every hk step, stays fast.
["lint:clippy"]
description = 'Run Clippy with the flags CI uses'
wait_for = ["build"]
run = [
  "cargo clippy --ignore-rust-version -- -D warnings",
  "cargo clippy --all-features --all-targets --ignore-rust-version -- -D warnings",
]
run_windows = "cargo clippy --workspace --all-targets --ignore-rust-version -- -D warnings"

[build]
alias = "b"
run = "{{ get_env(name='MISE_CARGO_BUILD_COMMAND', default='cargo build') }} --all-features {{ get_env(name='MISE_CARGO_BUILD_EXTRA_ARGS', default='') }}"
run_windows = "{{ get_env(name='MISE_CARGO_BUILD_COMMAND', default='cargo build') }} {{ get_env(name='MISE_CARGO_BUILD_EXTRA_ARGS', default='') }}"
description = "Build the project"
#sources = ["Cargo.*", "src/**/*.rs"]
#outputs = ["target/debug/mise"]

[docs]
description = 'Start the documentation development server'
depends = ['docs:setup']
run = "aube run docs:dev"

["docs:setup"]
description = 'Install documentation dependencies'
run = "aube install"

["docs:build"]
description = 'Build the documentation site'
depends = ["docs:setup"]
run = "aube run docs:build"

["docs:showreel-test"]
description = 'Type-check and test the landing-page showreel'
depends = ["docs:setup"]
run = ["aube run typecheck:showreel", "aube run test:showreel"]

["docs:preview"]
description = 'Preview the documentation site'
depends = ["docs:build"]
run = "aube run docs:preview"

["docs:demos"]
description = "Create recordings with vhs"
dir = "docs"
run = """
#!/usr/bin/env bash

if ! docker info > /dev/null 2>&1; then
  echo "This script uses docker, and it isn't running - please start docker and try again!"
  exit 1
fi

vhs() {
    docker run --rm -v $(pwd)/tapes/:/data -w /data ghcr.io/charmbracelet/vhs "$@"
}

# Create VHS recordings of all tape files in the assets directory
for i in $(ls -1 tapes/*.tape); do
    vhs $(basename $i .tape).tape
done
"""

["render:usage"]
description = 'Generate usage documentation'
depends = ["build"]
env = { CLICOLOR_FORCE = "0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Everything is written to a scratch directory first. mise.usage.kdl and
# tasks.md are moved into place once their command has succeeded, and the pages
# replace docs/cli only after every step has passed, so a failed run leaves
# docs/cli as it was. The scratch directory is in the repository so each move
# is a rename on one filesystem, and the pages sit at docs/cli inside it
# because markdownlint matches .markdownlintignore against paths relative to
# its working directory.
root="$PWD"
tmp="$(mktemp -d "$root/.render-usage.XXXXXX")"
out="$tmp/docs/cli"
cleanup() {
  # Put the previous pages back when the swap stopped between its two renames.
  if [ ! -e "$root/docs/cli" ] && [ -e "$tmp/previous" ]; then
    mv "$tmp/previous" "$root/docs/cli"
  fi
  rm -rf "$tmp"
}
trap cleanup EXIT
mkdir -p "$out"

mise usage > "$tmp/mise.usage.kdl"
mv "$tmp/mise.usage.kdl" mise.usage.kdl
mise generate task-docs > "$tmp/tasks.md"
mv "$tmp/tasks.md" tasks.md

mise x usage -- usage generate markdown -m --out-dir "$out" --url-prefix /cli --link-extension .html --html-encode --file mise.usage.kdl --replace-pre-with-code-fences
# usage-lib renders <SUBCOMMAND> for any command with subcommands. `mise bootstrap`
# can run without a subcommand, so normalize the generated markdown.
perl -0pi -e 's/mise bootstrap \[FLAGS\] <SUBCOMMAND>/mise bootstrap [FLAGS] [SUBCOMMAND]/g' "$out/bootstrap.md" "$out/index.md"
node --test docs/.vitepress/cli-reference.test.ts
node docs/.vitepress/cli-reference.ts "$out"
(cd "$tmp" && markdownlint --fix --config "$root/.markdownlint.json" --ignore-path "$root/.markdownlintignore" docs/cli)

if [ -e docs/cli ]; then
  mv docs/cli "$tmp/previous"
fi
mv "$out" docs/cli
'''

["render:completions"]
description = 'Generate shell completions'
depends = ["build"]
wait_for = ["render:usage"]
env = { NO_COLOR = "1" }
run = '''
#!/usr/bin/env bash
set -xeuo pipefail
mise completion bash > completions/mise.bash
mise completion zsh > completions/_mise
mise completion fish > completions/mise.fish
mise completion powershell > completions/mise.ps1
'''

["render:mangen"]
description = 'Generate man pages'
depends = ["render:usage"]
env = { NO_COLOR = "1" }
run = [
  "mise x usage -- usage generate manpage --file mise.usage.kdl > man/man1/mise.1",
  # usage's manpage renderer currently includes hidden flags. Omit this temporary
  # compatibility entry until it is removed alongside the alias in 2026.10.0.
  '''perl -0pi -e 's/\.TP\n\\fB\\-\\-from\\-git\\fR[^\n]*\nDeprecated alias for \\-\\-adopt\n//g' man/man1/mise.1''',
]

["render:help"]
description = 'Render help documentation'
depends = ["build"]
env = { NO_COLOR = "1" }
sources = ["mise"]
outputs = ["README.md"]
run = "mise render-help"

["render:llms"]
description = 'Generate docs/public/llms.txt (docs index for AI agents)'
# render:usage writes docs/cli/*.md and render:help writes cli_commands.ts,
# both of which the index is built from.
depends = ["render:usage", "render:help"]
sources = [
  "docs/**/*.md",
  "docs/.vitepress/sidebar.ts",
  "docs/.vitepress/llms.ts",
  "docs/.vitepress/llms.test.ts",
  # sidebar.ts builds the CLI section from this, so a render:help change to
  # command visibility must invalidate the index even if no markdown changed.
  "docs/.vitepress/cli_commands.ts",
  # the title and summary come from the docs homepage hero
  "docs/index.md",
]
outputs = ["docs/public/llms.txt"]
run = [
  "node --test docs/.vitepress/llms.test.ts",
  "node docs/.vitepress/llms.ts",
]

[render]
description = 'Run all render tasks'
depends = ["render:*"]

[snapshots]
description = "update test snapshots"
run = "cargo insta test --all-features --accept --unreferenced delete"

[test]
description = "run all tests"
alias = 't'
run = ["mise tasks run test:unit", "mise tasks run test:e2e --all"]

["test:unit"]
description = "run unit tests"
run = "cargo test --all-features --workspace"
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

# `cargo test <filter>` exits 0 when the filter matches nothing, so each of
# these tasks asserts the matching test count first: a renamed regression must
# fail its task rather than pass it silently.
["test:history:scoped-rollback"]
description = "unit tests that a stale index is extended without replaying history, while the whole live tree is recorded, its preimage stays encrypted, and production rollback then undo round-trips it"
run = """
set -eu
count=$(cargo test --all-features -p mise-system --lib -- --list 2>/dev/null | grep -c 'scoped_rollback' || true)
if [ "$count" -eq 0 ]; then
  echo "no scoped_rollback tests found" >&2
  exit 1
fi
cargo test --all-features -p mise-system --lib scoped_rollback
"""
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

["test:history:replay"]
description = "unit tests for selective rollback and undo planning (history::replay)"
run = """
set -eu
count=$(cargo test --all-features -p mise-system --lib -- --list 2>/dev/null | grep -c 'history::replay' || true)
if [ "$count" -eq 0 ]; then
  echo "no history::replay tests found" >&2
  exit 1
fi
cargo test --all-features -p mise-system --lib history::replay
"""
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

["test:unit-ci"]
description = "run unit tests with CI time limits"
# NEXTEST_PROFILE lets CI pick `ci-shared` on shared runners, where the strict
# ceilings are not a usable signal. Defaults to the strict `ci` profile.
run = [
  "cargo nextest run --profile ${NEXTEST_PROFILE:-ci} --all-features --ignore-rust-version --no-fail-fast",
  "cargo nextest run --profile ${NEXTEST_PROFILE:-ci} --workspace --exclude mise --ignore-rust-version --no-fail-fast",
  "cargo test --doc --workspace --exclude mise --ignore-rust-version",
]

["test:shuffle"]
description = 'Run tests with shuffling enabled'
run = 'cargo +nightly test --all-features -- -Z unstable-options --shuffle'

# A cold context is one with no index and no cached checkpoint metadata — a
# machine that has just cloned the history. These are the two guarantees a
# rollback on such a machine rests on, named for the proofs that gate them.
["test:history"]
description = "run the history model tests"
run = "cargo test --all-features -p mise-system --lib -- history::"
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

["test:history:cold-adoption"]
description = "a nested first adoption owns recovery and cannot bypass an active parent"
run = "cargo test --all-features -p mise-system --lib -- history::scope::tests::cold_adoption_"
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

["test:history:cold-rollback"]
description = "a cold rebuild derives each distinct manifest once, not once per checkpoint"
run = "cargo test --all-features -p mise-system --lib -- history::checkpoint::tests::cold_rebuild_resolves_each_manifest_once"
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

["test:history:cold-metadata-equivalence"]
description = "a cold rebuild records exactly what a single commit read does"
run = "cargo test --all-features -p mise-system --lib -- history::checkpoint::tests::cold_rebuild_matches_a_single_commit_read"
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

["test:history:cold-restore"]
description = "a cold encrypted history rolls back and undoes through the production path"
run = "cargo test --all-features -p mise-system --lib -- history::checkpoint::tests::cold_restore"
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

["test:history:replay-retention"]
description = 'Prove rollback and undo read only the checkpoint records they replay'
run = "cargo test -p mise-system --features vendored-lua --lib -- history::replay::retention"


["test:history:retention"]
description = "a full index rebuild holds one checkpoint payload at a time"
run = """
set -eu
filter='history::checkpoint::tests::rebuild_index_holds_one_checkpoint_payload_at_a_time'
listing=$(cargo test --all-features -p mise-system --lib -- --list)
count=$(printf '%s\n' "$listing" | grep -c "$filter" || true)
if [ "$count" -ne 1 ]; then
  echo "expected 1 test matching $filter, found $count" >&2
  exit 1
fi
cargo test --all-features -p mise-system --lib -- "$filter"
"""
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

["test:history:rebuild"]
description = "a full index rebuild records every checkpoint row, id, and annotation"
run = """
set -eu
filter='history::checkpoint::tests::rebuild_index_records_every_checkpoint_row'
listing=$(cargo test --all-features -p mise-system --lib -- --list)
count=$(printf '%s\n' "$listing" | grep -c "$filter" || true)
if [ "$count" -ne 1 ]; then
  echo "expected 1 test matching $filter, found $count" >&2
  exit 1
fi
cargo test --all-features -p mise-system --lib -- "$filter"
"""
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }

[install-dev]
description = 'Install the current project in debug mode'
run = 'cargo install --path . --debug'

[pre-commit]
description = 'Run pre-commit hooks'
env = { PRE_COMMIT = 1 }
run = ["mise run lint"]

[flamegraph]
description = 'Generate a flamegraph for performance analysis'
tools = { "cargo:flamegraph" = "latest" }
env = { CARGO_PROFILE_RELEASE_DEBUG = "true" }
run = 'cargo flamegraph'
